[project]
name = "quant-portfolio"
version = "0.1.0"
description = "Systematic quantitative trading strategies with institutional-grade risk metrics, execution simulation, and overfitting controls"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Anthony Shi" },
]

dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "scipy>=1.12",
    "statsmodels>=0.14",
    "yfinance>=0.2.36",
    "matplotlib>=3.8",
    "seaborn>=0.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "jupyterlab>=4.0",
    "pandas-stubs>=2.1",
]

[tool.setuptools.packages.find]
include = ["utils*", "strategies*", "models*", "portfolio*", "risk*", "tearsheet*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
